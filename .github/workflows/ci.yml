name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit tests need nothing; integration tests start Postgres/Redis via Testcontainers (Docker is available on the runner).
      - run: pnpm turbo run lint typecheck test test:integration build
